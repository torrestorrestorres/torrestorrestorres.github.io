<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>torrestorrestorres</title>
  <style>
    :root {
      --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff;
      --border: #e7e5e4; --accent: #2563eb; --tag: #f5f5f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --card: #1c1917;
        --border: #292524; --accent: #60a5fa; --tag: #292524;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
    h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); }
    h2 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 48px 0 12px;
    }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    a.card {
      display: block; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--card); color: inherit;
      text-decoration: none; transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .name { font-weight: 600; }
    .name::after { content: " ↗"; color: var(--muted); font-weight: 400; }
    .desc { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
    /* Web project descriptions reveal on hover (always shown on touch screens). */
    @media (hover: hover) {
      #web .desc {
        max-height: 0; opacity: 0; overflow: hidden; margin-top: 0;
        transition: max-height .25s ease, opacity .2s ease, margin-top .25s ease;
      }
      #web a.card:hover .desc, #web a.card:focus-visible .desc {
        max-height: 6em; opacity: 1; margin-top: 2px;
      }
    }
    .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span {
      font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; background: var(--tag);
    }
    .status { color: var(--muted); font-size: 0.95rem; }
    footer { margin-top: 64px; color: var(--muted); font-size: 0.85rem; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>torrestorrestorres</h1>
      <p>Projects &amp; experiments.</p>
    </header>

    <h2>Web projects</h2>
    <ul id="web"><li class="status">Loading…</li></ul>

    <h2>Other projects</h2>
    <ul id="other"></ul>

    <footer>
      <a href="https://github.com/torrestorrestorres">github.com/torrestorrestorres</a>
    </footer>
  </main>

  <script>
    // ---- Config -------------------------------------------------------------
    const USER = "torrestorrestorres";

    // Repos with GitHub Pages that should NOT be listed.
    const HIDE = ["torrestorrestorres.github.io"];

    // Manually listed projects (non-web stuff, or anything hosted elsewhere).
    // url is optional; tags are optional.
    const MANUAL = [
      // { name: "angular", desc: "Angular playground", url: "https://github.com/torrestorrestorres/angular", tags: ["angular"] },
    ];
    // -------------------------------------------------------------------------

    function card({ name, desc, url, tags = [] }) {
      const li = document.createElement("li");
      const el = document.createElement(url ? "a" : "div");
      el.className = "card";
      if (url) el.href = url;
      el.innerHTML = `<div class="name"></div>${desc ? '<div class="desc"></div>' : ""}`;
      el.querySelector(".name").textContent = name;
      if (desc) el.querySelector(".desc").textContent = desc;
      if (tags.length) {
        const t = document.createElement("div");
        t.className = "tags";
        for (const tag of tags) t.appendChild(Object.assign(document.createElement("span"), { textContent: tag }));
        el.appendChild(t);
      }
      li.appendChild(el);
      return li;
    }

    function render(id, items, empty) {
      const ul = document.getElementById(id);
      ul.replaceChildren(...(items.length ? items.map(card) : [Object.assign(document.createElement("li"), { className: "status", textContent: empty })]));
    }

    render("other", MANUAL, "Nothing here yet.");

    fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(repos => render("web",
        repos
          .filter(r => r.has_pages && !r.fork && !r.archived && !HIDE.includes(r.name))
          .map(r => ({
            name: r.name,
            desc: r.description,
            url: r.homepage || `https://${USER}.github.io/${r.name}/`,
            tags: r.topics || [],
          })),
        "No web projects yet."))
      .catch(() => render("web", [], "Couldn't load projects from GitHub right now."));
  </script>
</body>
</html>
